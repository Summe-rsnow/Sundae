[package]
name = "nsh-app-sundae"
version = "1.1.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Summe-rsnow/Sundae"
publish = false

[workspace]

[dependencies]
nsh-core = { version = "0.6.1", features = ["svg"] }
nsh-base = { version = "0.6.1", default-features = false }
bento = { git = "https://github.com/Summe-rsnow/Bento.git", tag = "v1.1.1" }
ureq = { version = "3.5", default-features = false, features = ["rustls", "socks-proxy"] }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "6.0"
parking_lot = "0.12"
env_logger = "0.11"
log = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.6.1", default-features = false, features = ["svg"] }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.6.1", default-features = false, features = ["svg"] }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.6.1", default-features = false, features = ["svg"] }

[dev-dependencies]
nsh-engine = "0.6.1"
nsh-testing = { version = "0.6.1", features = ["live"] }

